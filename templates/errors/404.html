{% extends "base.html" %}

{% block title %}Page Not Found - SkillBridge AI{% endblock %}

{% block content %}
<section style="padding: 6rem 0; text-align: center;">
  <div class="container" style="max-width: 600px;">
    <span class="badge badge-lavender" style="font-size: 1rem; margin-bottom: 1.5rem;">404 Error</span>
    <h1 style="font-size: 3rem; color: var(--color-primary-navy); margin-bottom: 1rem;">Page Not Found</h1>
    <p class="text-muted" style="font-size: 1.15rem; margin-bottom: 2rem;">
      The requested page or placement module does not exist or has been moved.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Return to Home
    </a>
  </div>
</section>
{% endblock %}
