{% extends "base.html" %}

{% block title %}Server Error - SkillBridge AI{% endblock %}

{% block content %}
<section style="padding: 6rem 0; text-align: center;">
  <div class="container" style="max-width: 600px;">
    <span class="badge badge-lavender" style="font-size: 1rem; margin-bottom: 1.5rem;">500 Internal Error</span>
    <h1 style="font-size: 3rem; color: var(--color-primary-navy); margin-bottom: 1rem;">System Error</h1>
    <p class="text-muted" style="font-size: 1.15rem; margin-bottom: 2rem;">
      An unexpected condition occurred while processing your placement analytics request.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
      Return to Home
    </a>
  </div>
</section>
{% endblock %}
